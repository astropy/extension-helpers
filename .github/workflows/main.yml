name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@e5af21e4ae37af089a73bb032e10b78b0e746174  # v3.0.1
    with:
      posargs: --openmp-expected=True
      coverage: ''
      envs: |
        # Standard tests

        - linux: py310-test-oldestdeps
        - linux: py311-test-cov
          coverage: codecov
        - linux: py312-test-cov
          coverage: codecov
        - linux: py313-test-cov
          coverage: codecov
        - linux: py313-test-cov-devdeps
          coverage: codecov

        - macos: py312-test
          posargs: --openmp-expected=False
          coverage: codecov
        - macos: py313-test-devdeps
          posargs: --openmp-expected=False
          coverage: codecov

        - windows: py310-test
        - windows: py312-test-devdeps
          coverage: codecov

        # Test with more compilers, for the OpenMP helpers
        - macos: py313-test-osxclang-conda
          runs-on: macos-14
        - linux: py310-test-linuxgcc-conda

        # Test downstream packages
        - linux: py313-downstream

  publish:
    needs: tests
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@e5af21e4ae37af089a73bb032e10b78b0e746174  # v3.0.1
    with:
      test_extras: test
      test_command: pytest --pyargs extension_helpers
    secrets:
      pypi_token: ${{ secrets.PYPI_TOKEN }}
